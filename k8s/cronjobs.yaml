# Scheduled read-only jobs (§14). Both run in read_only mode; neither writes.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: scoutnet-membership-manager-canary
spec:
  # Weekly by default and configurable. Seasonal software — catch breakage in
  # April, not the day two hundred scouts need moving (§14).
  schedule: "0 6 * * 1"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: canary
              image: scoutnet-membership-manager:latest
              args: ["membership-manager", "canary", "--mode", "read_only"]
              envFrom:
                - configMapRef: { name: scoutnet-membership-manager-config }
                - secretRef: { name: scoutnet-membership-manager-secrets }
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: scoutnet-membership-manager-spec-drift
spec:
  schedule: "0 7 * * 1"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: spec-drift
              image: scoutnet-membership-manager:latest
              args: ["membership-manager", "drift-check"]
              envFrom:
                - configMapRef: { name: scoutnet-membership-manager-config }
