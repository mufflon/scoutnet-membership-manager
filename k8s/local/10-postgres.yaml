# PVC-backed Postgres for the local deployment. The Secret (karverktyg-secrets)
# is created by scripts/k8s-up.sh from your .conf — not committed here.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: karverktyg-db-data
  namespace: karverktyg
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: karverktyg-db
  namespace: karverktyg
spec:
  replicas: 1
  strategy:
    type: Recreate # single ReadWriteOnce volume
  selector:
    matchLabels: { app: karverktyg-db }
  template:
    metadata:
      labels: { app: karverktyg-db }
    spec:
      containers:
        - name: postgres
          image: postgres:17
          envFrom:
            - secretRef: { name: karverktyg-secrets }
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
              subPath: pgdata
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "karverktyg"] }
            periodSeconds: 5
            timeoutSeconds: 3
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: karverktyg-db-data
---
apiVersion: v1
kind: Service
metadata:
  name: karverktyg-db
  namespace: karverktyg
spec:
  selector: { app: karverktyg-db }
  ports:
    - port: 5432
      targetPort: 5432
