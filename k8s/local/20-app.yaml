# The app, wired to the in-cluster Postgres. Config (mode, keys, DSN) comes from
# the karverktyg-secrets secret that scripts/k8s-up.sh builds from your .conf.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: karverktyg
  namespace: karverktyg
  labels: { app: karverktyg }
spec:
  replicas: 1
  selector:
    matchLabels: { app: karverktyg }
  template:
    metadata:
      labels: { app: karverktyg }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        # so the mounted snapshot volume is writable by the non-root user
        fsGroup: 10001
      volumes:
        # Pre-run snapshot files for the write path (§8). Harmless in
        # fixture/read_only — nothing writes here until a read_write bulk run.
        - name: snapshots
          persistentVolumeClaim:
            claimName: karverktyg-snapshots
      initContainers:
        - name: wait-for-db
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z karverktyg-db 5432; do echo waiting for db; sleep 1; done"]
        # Bring the DB to the current schema: reuse/migrate if compatible, else
        # keep templates and rebuild (see db.bootstrap). Idempotent.
        - name: db-bootstrap
          image: karverktyg:latest
          imagePullPolicy: IfNotPresent
          args: ["karverktyg", "db-bootstrap"]
          envFrom:
            - secretRef: { name: karverktyg-secrets }
      containers:
        - name: karverktyg
          image: karverktyg:latest
          imagePullPolicy: IfNotPresent # image is read from the docker store by k3s
          envFrom:
            - secretRef: { name: karverktyg-secrets }
          volumeMounts:
            - name: snapshots
              mountPath: /var/lib/karverktyg/snapshots
          ports:
            - containerPort: 8000
          livenessProbe:
            httpGet: { path: /healthz, port: 8000 }
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet: { path: /readyz, port: 8000 }
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            # Generous headroom: gthread workers + WeasyPrint PDF rendering. Runs
            # on the operator's own hardware, so no reason to run this tight.
            requests: { cpu: "250m", memory: "512Mi" }
            limits: { cpu: "2", memory: "1536Mi" }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: karverktyg-snapshots
  namespace: karverktyg
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests: { storage: 1Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: karverktyg
  namespace: karverktyg
spec:
  selector: { app: karverktyg }
  ports:
    - port: 80
      targetPort: 8000
