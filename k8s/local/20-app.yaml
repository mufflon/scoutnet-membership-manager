# The app, wired to the in-cluster Postgres. Config (mode, keys, DSN) comes from
# the scoutnet-membership-manager-secrets secret that scripts/k8s-up.sh builds from your .conf.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scoutnet-membership-manager
  namespace: scoutnet-membership-manager
  labels: { app: scoutnet-membership-manager }
spec:
  replicas: 1
  selector:
    matchLabels: { app: scoutnet-membership-manager }
  template:
    metadata:
      labels: { app: scoutnet-membership-manager }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        # so the mounted snapshot volume is writable by the non-root user
        fsGroup: 10001
      volumes:
        # Pre-run snapshot files for the write path (§8). Harmless in
        # fixture/read_only — nothing writes here until a read_write bulk run.
        - name: snapshots
          persistentVolumeClaim:
            claimName: scoutnet-membership-manager-snapshots
      initContainers:
        - name: wait-for-db
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z scoutnet-membership-manager-db-rw 5432; do echo waiting for db; sleep 1; done"]
        # Bring the DB to the current schema: reuse/migrate if compatible, else
        # keep templates and rebuild (see db.bootstrap). Idempotent.
        - name: db-bootstrap
          image: scoutnet-membership-manager:latest
          imagePullPolicy: IfNotPresent
          args: ["membership-manager", "db-bootstrap"]
          envFrom:
            - secretRef: { name: scoutnet-membership-manager-secrets }
      containers:
        - name: scoutnet-membership-manager
          image: scoutnet-membership-manager:latest
          imagePullPolicy: IfNotPresent # image is read from the docker store by k3s
          envFrom:
            - secretRef: { name: scoutnet-membership-manager-secrets }
          env:
            # Where the write path (§8) writes its pre-run snapshots. Must match
            # the volumeMount below — it is deployment infra, not app config, so it
            # lives here beside the mount, not in scoutnet-membership-manager.json.
            # If the two ever diverge, reconciling them is the deployer's job.
            - name: SCOUTNET_SNAPSHOT_DIR
              value: /var/lib/scoutnet-membership-manager/snapshots
          volumeMounts:
            - name: snapshots
              mountPath: /var/lib/scoutnet-membership-manager/snapshots
          ports:
            - containerPort: 8000
          livenessProbe:
            httpGet: { path: /healthz, port: 8000 }
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet: { path: /readyz, port: 8000 }
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            # Generous headroom: gthread workers + WeasyPrint PDF rendering. Runs
            # on the operator's own hardware, so no reason to run this tight.
            requests: { cpu: "250m", memory: "512Mi" }
            limits: { cpu: "2", memory: "1536Mi" }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: scoutnet-membership-manager-snapshots
  namespace: scoutnet-membership-manager
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests: { storage: 1Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: scoutnet-membership-manager
  namespace: scoutnet-membership-manager
spec:
  selector: { app: scoutnet-membership-manager }
  ports:
    - port: 80
      targetPort: 8000
