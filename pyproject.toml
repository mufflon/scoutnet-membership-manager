[project]
name = "karverktyg"
version = "0.1.0"
description = "Internal Scoutnet tool for a Swedish scoutkår (default: Scoutkåren Finn, Lund). Phase 1 — read-only."
readme = "README.md"
requires-python = ">=3.14"
license = { text = "Proprietary" }

# Versions per CLAUDE.md §3 (stated verified on PyPI 2026-08-02). The heavy
# native-dependency packages (WeasyPrint, PyICU, Google) live in optional
# extras below so the base install and the test suite need no system libraries.
dependencies = [
    "flask==3.1.3",
    "gunicorn==26.0.0",
    "httpx==0.28.1",
    "tenacity==9.1.4",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "sqlalchemy==2.0.51",
    "alembic==1.18.5",
    "psycopg[binary]==3.3.4",
    "openpyxl==3.1.5",
    "jinja2==3.1.6",
    "phonenumbers==9.0.36",
    "email-validator==2.3.0",
]

[project.optional-dependencies]
# PDF report rendering. Needs system libs (pango, cairo, gobject) at runtime.
pdf = ["weasyprint==69.0"]
# Swedish ICU collation in Python. Needs icu4c. Postgres sv-SE-x-icu is the
# primary path; this is the fallback when sorting in Python. See collation.py.
icu = ["pyicu==2.15"]
# Gmail send. Only imported by the Gmail MailSender implementation (§10).
google = ["google-api-python-client==2.198.0", "google-auth==2.56.2"]

[project.scripts]
karverktyg = "karverktyg.cli:main"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/karverktyg"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
