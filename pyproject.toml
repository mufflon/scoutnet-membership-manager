[project]
name = "karverktyg"
version = "0.1.0"
description = "Internal Scoutnet tool for a Swedish scoutkår (default: Scoutkåren Finn, Lund). Phase 1 — read-only."
readme = "README.md"
requires-python = ">=3.14"
license = { text = "Proprietary" }

# Versions per CLAUDE.md §3 (stated verified on PyPI 2026-08-02). The heavy
# native-dependency packages (WeasyPrint, PyICU, Google) live in optional
# extras below so the base install and the test suite need no system libraries.
dependencies = [
    "flask==3.1.3",
    "gunicorn==26.0.0",
    "httpx==0.28.1",
    "tenacity==9.1.4",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "sqlalchemy==2.0.51",
    "alembic==1.18.5",
    "psycopg[binary]==3.3.4",
    "openpyxl==3.1.5",
    "jinja2==3.1.6",
    "phonenumbers==9.0.36",
    "email-validator==2.3.0",
]

[project.optional-dependencies]
# PDF report rendering. Needs system libs (pango, cairo, gobject) at runtime.
pdf = ["weasyprint==69.0"]
# Swedish ICU collation in Python. Needs icu4c. Postgres sv-SE-x-icu is the
# primary path; this is the fallback when sorting in Python. See collation.py.
icu = ["pyicu==2.15"]
# Gmail send. Only imported by the Gmail MailSender implementation (§10).
google = ["google-api-python-client==2.198.0", "google-auth==2.56.2"]

[project.scripts]
karverktyg = "karverktyg.cli:main"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pyyaml==6.0.2",
    "ruff==0.16.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/karverktyg"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812", # incorrectly requires commas for strings in log messages
    "D203",   # one-blank-line-before-class
    "D212",   # summary line in docstrings will start with the second raw
    "D413",   # not applicable for numpy docstrings
    "EM101",  # raw-string-in-exception
    "EM102",  # we want to use f string in exception messages
    "FA100",  # we want to avoid importing __future__
    "G004",   # we want to use f string in log messages
    "TRY003", # we want to write long exception messages
    "TD002",  # TODO need no ticket
    "TD003",  # TODO need no author
    "FIX002", # TODO is for the future, not now
    "RUF013", # Explicit optional parameters are suboptimal, but fine-ish
    "D107",   # Don't require docstring for __init__
    # --- added for this codebase (not in the shared base list) ---
    "RUF001", # Swedish domain text (å, ä, ö) is not "ambiguous unicode"
    "RUF002", # same, in docstrings
    "RUF003", # same, in comments
    "TC001",  # moving first-party types to TYPE_CHECKING breaks SQLAlchemy Mapped[]
    "TC002",  # ditto for third-party (pydantic evaluates annotations at runtime)
    "TC003",  # ditto for stdlib (e.g. datetime in ORM models)
    "CPY001", # no per-file copyright header for this internal tool
    "PLC0415", # lazy imports are deliberate (optional deps, CLI subcommands)
    "PLR0913", # parametric builder functions (changelist, drafts) take many args
    "PLR0917", # ditto, positional
    "ANN401", # Any is correct at the dynamic JSON parsing boundary
    "N818",   # descriptive exception names (CohortYearConflict, ChangelistAckRequired)
    # docstring micro-style (same category as the already-ignored D203/D212/D413);
    # docstrings are still required to exist (D101/D102/D103), just not policed for
    # mood/period/blank-line placement:
    "D205",   # blank line between summary and description
    "D400",   # first line ends with a period
    "D401",   # imperative mood
    "D415",   # first line ends with punctuation
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",    # we need assertions for tests
    "D",       # docstrings are not mandatory for tests
    "ANN",     # type annotations are optional in tests (fixtures are self-documenting)
    "PLR",     # complexity/magic-value limits are irrelevant in test expectations
    "INP001",  # test packages need no __init__.py
    "SLF001",  # tests may poke private members
    "N802",    # test fakes mimic external PascalCase SDK method names
    "PT018",   # composite asserts are readable in tests
    "PT006",   # parametrize name style is fine
    "DTZ",     # naive datetimes are fine in test fixtures
]
# Throwaway Phase-0 spike scripts (stdlib, print structure to stdout) — §7.
"scripts/**/*.py" = ["D", "ANN", "T201", "S", "PLR", "C901", "BLE001", "TRY", "PTH", "PERF", "PLW", "PLC", "N", "ARG", "FBT", "EXE001", "RUF", "DTZ"]
# Alembic migrations follow their own generated conventions.
"migrations/**/*.py" = ["D", "ANN", "INP001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
