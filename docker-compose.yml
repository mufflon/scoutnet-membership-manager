# Local development. `docker compose up` runs the app in fixture mode (no
# credentials, in-memory SQLite) with a Postgres alongside for read_only work.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: karverktyg
      POSTGRES_USER: karverktyg
      POSTGRES_PASSWORD: devpassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U karverktyg"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    environment:
      SCOUTNET_MODE: fixture
      SCOUTNET_DATABASE_URL: postgresql+psycopg://karverktyg:devpassword@db/karverktyg
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
